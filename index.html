    <!-- Register Service Worker for PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);
              
              // Check for updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New content available, show update prompt
                    console.log('New content available, refresh to update.');
                  }
                });
              });
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
        
        // Handle controller change (after update)
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          window.location.reload();
        });
      }
    </script>
    
    <!-- PWA Install Prompt Handler -->
    <script>
      let deferredPrompt;
      
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent Chrome 67 and earlier from automatically showing the prompt
        e.preventDefault();
        // Stash the event so it can be triggered later
        deferredPrompt = e;
        
        // Show custom install button or notification
        console.log('PWA install prompt available');
        
        // Dispatch custom event for the app to handle
        window.dispatchEvent(new CustomEvent('pwa-install-available', { detail: deferredPrompt }));
      });
      
      window.addEventListener('appinstalled', () => {
        // Hide the custom install UI
        deferredPrompt = null;
        console.log('PWA installed successfully');
        
        // Dispatch custom event
        window.dispatchEvent(new CustomEvent('pwa-installed'));
        
        // Optionally track installation
        if (typeof gtag !== 'undefined') {
          gtag('event', 'pwa_install', {
            'event_category': 'engagement',
            'event_label': 'PWA Install'
          });
        }
      });
      
      // Function to trigger install prompt (call this from your UI)
      window.installPWA = async () => {
        if (!deferredPrompt) {
          console.log('Install prompt not available');
          return false;
        }
        
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        console.log('Install prompt outcome:', outcome);
        deferredPrompt = null;
        return outcome === 'accepted';
      };
    </script>
